<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drift — music player with synced lyrics</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&family=Noto+Sans+Georgian:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a09;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--text:#f1f4ee;--mute:#8d958a;--ac:#d4f5b4;--tint:140;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;background:#000;color:var(--text);font:14px/1.4 Manrope,'Noto Sans Georgian',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{display:grid;grid-template-columns:72px 1fr;grid-template-rows:1fr 88px;height:100%}
#side{grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0;overflow-y:auto;scrollbar-width:none}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mute);transition:.15s}
.ib:hover{background:var(--glass);color:var(--text)}.ib.on{background:var(--glass2);color:var(--ac)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo{margin-bottom:10px;color:var(--ac)}
#main{position:relative;overflow:auto;border-radius:22px 0 0 0;background:radial-gradient(900px 500px at 70% -10%,hsla(var(--tint),30%,40%,.55),transparent 70%),var(--bg);padding:34px 28px 24px;transition:background .6s}
h1{font:800 clamp(52px,9vw,96px)/.95 Unbounded,'Noto Sans Georgian',sans-serif;color:var(--ac);letter-spacing:-.02em}
h1 span{color:var(--text)}
h2{font:600 28px Unbounded,'Noto Sans Georgian',sans-serif;margin:34px 0 14px}h2 b{color:var(--ac);font-weight:600}
.btn{background:var(--ac);color:#12200a;font-weight:700;padding:11px 26px;border-radius:12px}
.btn.g{background:var(--glass);color:var(--text);padding:11px 14px}
.hero{position:relative;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:18px}
#halo{position:absolute;right:0;top:-10px;width:min(46%,420px);aspect-ratio:2/1;opacity:.9}
.row{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.mix{flex:0 0 176px;width:176px;min-width:0;overflow:hidden;text-align:left}.mix p,.mix small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mix .c{position:relative;width:176px;height:176px;border-radius:12px;overflow:hidden}
.mix img,.cv{width:100%;height:100%;object-fit:cover;display:block}
.mix .c i{position:absolute;left:12px;bottom:6px;font:800 34px Unbounded;font-style:normal;text-shadow:0 2px 12px #0008}
.mix p{margin-top:8px;font-weight:700}.mix small,.sub{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 24px}
.tr{display:flex;align-items:center;gap:12px;padding:6px;border-radius:10px;text-align:left;width:100%}
.tr:hover{background:var(--glass)}.tr.cur .t{color:var(--ac)}
.tr img{width:50px;height:50px;border-radius:6px}.tr .m{flex:1;min-width:0}.t{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.d{color:var(--mute);font-size:13px}
input.s{width:100%;max-width:520px;background:var(--glass);border:0;border-radius:14px;padding:14px 18px;color:var(--text);font:inherit;outline:2px solid transparent}
input.s:focus{outline-color:var(--ac)}
.empty{color:var(--mute);padding:30px 0}
#bar{grid-column:2;display:grid;grid-template-columns:1fr minmax(260px,2fr) 1fr;align-items:center;gap:12px;padding:0 18px;background:rgba(255,255,255,.04);backdrop-filter:blur(20px);border-radius:16px 0 0 0}
#np{display:flex;align-items:center;gap:12px;min-width:0}#np img{width:54px;height:54px;border-radius:8px;background:var(--glass)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:4px}.btns{display:flex;align-items:center;gap:10px}
.pp{width:46px;height:46px;border-radius:50%;background:var(--ac);color:#12200a;display:grid;place-items:center}
.pp svg,.sm svg{width:22px;height:22px;fill:currentColor}.sm{width:34px;height:34px;display:grid;place-items:center;color:var(--mute)}.sm.on,.sm:hover{color:var(--ac)}
.pr{display:flex;align-items:center;gap:10px;width:100%;color:var(--mute);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:linear-gradient(to right,var(--ac) var(--p,0%),var(--glass2) var(--p,0%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
input[type=range]:hover::-webkit-slider-thumb{width:12px;height:12px;border-radius:50%;background:#fff}
.rt{display:flex;justify-content:flex-end;align-items:center;gap:6px}.rt input{flex:0 0 90px}
#fs{position:fixed;inset:0;z-index:20;display:none;background:#000;overflow:hidden}
#fs.open{display:block}#fs .bg{position:absolute;inset:-20%;filter:blur(70px) saturate(1.4);opacity:.85;transition:background 1s;animation:sw 24s ease-in-out infinite alternate}
@keyframes sw{to{transform:rotate(14deg) scale(1.15)}}
#fs .in{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:6vw;align-items:center;padding:6vh 6vw}
#fs .art{width:100%;aspect-ratio:1;border-radius:16px;box-shadow:0 30px 80px #0008}
#ly{height:84vh;overflow:auto;scroll-behavior:smooth;padding:38vh 0;mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}
#ly p{font:800 clamp(24px,3.4vw,44px)/1.15 Unbounded,'Noto Sans Georgian',sans-serif;padding:10px 0;opacity:.3;cursor:pointer;transition:.3s;transform-origin:left}
#ly p.on{opacity:1;transform:scale(1.03)}#ly p.past{opacity:.45}
.fsb{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;z-index:2;display:flex;gap:8px}
.fsb button{background:var(--glass2);padding:10px 16px;border-radius:12px;font-weight:700;backdrop-filter:blur(10px)}
.ib.s{width:32px;height:32px;font-size:20px;border-radius:10px}.ib:disabled{opacity:.3;cursor:default;pointer-events:none}#gl{position:absolute;inset:0;width:100%;height:100%;display:none}#fs.gl #gl{display:block}#fs.gl .bg{display:none}#ly.u p{opacity:.85;cursor:default}.set{max-width:620px}.set h2{font-size:20px;margin:28px 0 12px}.eqr{display:flex;align-items:center;gap:12px;margin:10px 0;color:var(--mute)}.eqr span:first-child{width:56px}.eqr span:last-child{width:52px;text-align:right}select.s{max-width:260px}
#ly p .w{transition:opacity .12s}#ly p.on .w:not(.f){opacity:.4}#ly p.past .w{opacity:1}
#viz{position:absolute;inset:0;width:100%;height:100%;opacity:.55;mix-blend-mode:screen;pointer-events:none}
#fs .art{transform:scale(calc(1 + var(--b,0)*.05));transition:transform .08s}
.fsb span{align-self:center;min-width:44px;text-align:center;font-weight:700}
.x{color:var(--mute);padding:4px 8px;border-radius:8px}.x:hover{color:#ff8a8a}
#pm,#toast{position:fixed;z-index:30;background:#1a1d19;border-radius:14px;box-shadow:0 12px 40px #000a}
#pm{right:16px;bottom:96px;padding:6px;min-width:200px;display:none}#pm button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px}#pm button:hover{background:var(--glass2)}
#toast{left:50%;bottom:104px;transform:translateX(-50%);padding:10px 18px;font-weight:700;display:none}
.pn{display:flex;gap:8px;max-width:620px}.pn .s{flex:1 1 150px;width:auto}textarea.s{min-height:76px;resize:vertical}select.s{flex:0 0 auto}
.card{position:relative;background:var(--glass);border-radius:14px;padding:12px 40px 12px 16px;margin-bottom:10px;max-width:760px}.card p{margin:6px 0;color:var(--mute)}.card .x{position:absolute;top:8px;right:8px}.card .btn{padding:7px 14px;margin-top:6px}
@media(max-width:760px){#app{grid-template-columns:56px 1fr}#bar{grid-template-columns:1fr auto}.rt{display:none}.pr{display:none}#main{padding:24px 16px}#fs .in{grid-template-columns:1fr;padding:12vh 6vw 4vh}#fs .art{display:none}#halo{opacity:.35}}
</style></head><body>
<div id="app">
 <nav id="side">
  <div class="ib logo"><svg viewBox="0 0 32 32" style="width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><path d="M3 16c4-9 6-9 9 0s5 9 9 0 5-9 8-3"/></svg></div>
  <div style="display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-bottom:6px"><button class="ib s" id="hb" title="Back">‹</button><button class="ib s" id="hf" title="Forward">›</button></div>
  <button class="ib on" data-v="home" title="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></button>
  <button class="ib" data-v="search" title="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  <button class="ib" data-v="lib" title="Library"><svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg></button>
  <button class="ib" data-v="acct" title="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg></button>
  <button class="ib" data-v="room" title="Listening rooms"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.5"/><circle cx="17" cy="10" r="2.5"/><path d="M3 19c.5-3.5 3-5 6-5s5.5 1.5 6 5M16 15c3 0 4.5 1.5 5 4"/></svg></button>
  <button class="ib" data-v="diary" title="Music diary"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h3"/></svg></button>
  <button class="ib" id="addb" title="Add music"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" data-v="set" title="Settings" style="margin-top:auto"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button>
 </nav>
 <main id="main"></main>
 <div id="bar">
  <div id="np"><img id="bc" alt=""><div style="min-width:0"><span class="t" id="bt">Nothing playing</span><span class="sub" id="ba">Add music or press Play</span></div><button class="sm" id="lk" title="Like"><svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"/></svg></button></div>
  <div class="ctl"><div class="btns">
   <button class="sm" id="sh" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M3 7h3l9 10h6l-2.5 2.5L17 17M3 17h3l3-3.4M15 7h6l-2.5-2.5M21 7l-2.5 2.5M11 9.4L9 7"/></svg></button>
   <button class="sm" id="pv"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
   <button class="pp" id="pl"><svg viewBox="0 0 24 24" id="pi"><path d="M7 4l13 8-13 8z"/></svg></button>
   <button class="sm" id="nx"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
   <button class="sm" id="rp" title="Repeat"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4V7H5v3H3V6a1 1 0 0 1 1-1h13zM7 22l-4-4 4-4v3h12v-3h2v4a1 1 0 0 1-1 1H7z"/></svg></button></div>
   <div class="pr"><span id="tc">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="td">0:00</span></div></div>
  <div class="rt"><button class="sm" id="atp" title="Add to playlist">＋</button><button class="sm" id="pip" title="Mini player">⧉</button><button class="sm" id="lyb" title="Lyrics"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 11h16M4 16h10"/><path d="M4 6h16M4 11h16M4 16h10" style="stroke:currentColor;stroke-width:2;fill:none"/></svg></button><input type="range" id="vo" min="0" max="100" value="80"></div>
 </div>
</div>
<div id="fs"><div class="bg" id="fbg"></div><canvas id="gl"></canvas><canvas id="viz"></canvas><div class="fsb"><button id="om" title="Lyrics later">−</button><span id="ov">0.0s</span><button id="op" title="Lyrics earlier">+</button><button id="addl">Add .lrc</button><button id="fx">Close</button></div>
 <div class="in"><div><img class="art" id="fa" alt=""><h2 style="font-size:22px;margin:18px 0 2px" id="ft"></h2><span class="sub" id="fr"></span></div><div id="ly"></div></div></div>
<div id="pm"></div><div id="toast"></div><input type="file" id="fa_in" accept="audio/*" multiple hidden><input type="file" id="fl_in" accept=".lrc,.txt" hidden>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function cover(seed,size=240){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),h=seed%360;x.fillStyle=`hsl(${h} 40% 12%)`;x.fillRect(0,0,size,size);const n=30,s=size/n,ph=seed%6+2;for(let i=0;i<n;i++)for(let j=0;j<n;j++){const u=i/n,v=j/n,d=Math.hypot(u-.5,v-.5),val=(Math.sin(u*ph*3+seed)+Math.cos(v*ph*2.3)+1.7-d*3.2)/4,r=Math.max(0,Math.min(1,val))*s*.52;x.fillStyle=`hsl(${(h+v*60)%360} 65% 68%)`;x.beginPath();x.arc(i*s+s/2,j*s+s/2,r,0,7);x.fill()}return c.toDataURL()}
function wav(notes,sec=32,sr=8000){const n=sec*sr,b=new DataView(new ArrayBuffer(44+n*2)),w=(o,s)=>[...s].forEach((c,i)=>b.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');b.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,sr,true);b.setUint32(28,sr*2,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,n*2,true);for(let i=0;i<n;i++){const t=i/sr,f=notes[Math.floor(t*2)%notes.length],e=Math.exp(-(t*2%1)*3);b.setInt16(44+i*2,Math.sin(6.283*f*t)*e*9000+Math.sin(12.566*f*t)*e*2500,true)}return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function parseLrc(txt){const o=[];for(const l of txt.split(/\r?\n/)){const m=[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)],raw=l.replace(/\[[^\]]*\]/g,'').trim(),w=[...raw.matchAll(/<(\d+):(\d+(?:\.\d+)?)>([^<]*)/g)].map(a=>({t:+a[1]*60+ +a[2],s:a[3]})),t=raw.replace(/<[^>]*>/g,'').trim();m.forEach(a=>o.push({t:+a[1]*60+ +a[2],text:t||'♪',w:w.length?w:null}))}return o.sort((a,b)=>a.t-b.t)}
const tfmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+(s%60).toFixed(2).padStart(5,'0');const demoLrc=l=>l.map((t,i)=>{const w=t.split(' ');return `[${tfmt(i*4)}]`+w.map((x,k)=>`<${tfmt(i*4+k*3.2/w.length)}>${x} `).join('').trim()}).join('\n');
const T=[];let cur=-1,view='home',shuf=false,rep=false,likes=new Set;
try{likes=new Set(JSON.parse(localStorage.getItem('drift-likes')||'[]'))}catch(e){}
function add(title,artist,src,lrc,dur){const seed=hash(artist+title),t={title,artist,src,lrc:lrc||[],seed,cv:cover(seed),dur:dur||0,key:artist+'|'+title};T.push(t);if(!dur){const a=new Audio(src);a.onloadedmetadata=()=>{t.dur=a.duration;render()}}return t}
add('Night Bus','Paper Lanterns',wav([220,277,330,262]),parseLrc(demoLrc(['♪','Streetlights hum along the river','Every window holds a quiet glow','I count the stops and let them go','Nothing left to carry, nothing owed','The city breathes in slow motion','Take me where the sidewalk ends','Past the last light, past the rain','Play it again, play it again'])),32);
add('Glass Hours','Velvet Static',wav([196,247,294,330,247]),parseLrc(demoLrc(['♪','Hours like glass slip through my hands','Shatter soft on the kitchen floor','Sunlight leaning on the door','Say my name like a song you knew','We were static, we were new','Turn the volume up on the dawn','Let the morning carry on','Stay a little while'])),32);
add('Low Tide','Moss & Ember',wav([165,196,247,196]),parseLrc(demoLrc(['♪','The water pulls back from the shore','Leaving shells and what we kept','Footprints fill and disappear','Nothing here is truly lost','Only waiting for the sea','Low tide, low tide','Bring it home to me','♪'])),32);
const au=new Audio();au.volume=.8;
const ic={play:'<path d="M7 4l13 8-13 8z"/>',pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'};
function setTint(){const t=T[cur];if(!t)return;document.documentElement.style.setProperty('--tint',t.seed%360)}
function play(i){if(i<0||i>=T.length)return;cur=i;const t=T[i];au.src=t.src;au.play().catch(()=>{});$('#bc').src=t.cv;$('#bt').textContent=t.title;$('#ba').textContent=t.artist;setTint();fsUpdate();render();updLike();pipUp();findLyrics(t)}
let queue=null;
function playList(list,start=0){queue=list.map(t=>T.indexOf(t));play(queue[start])}
function nextIdx(d){if(!T.length)return -1;if(shuf&&d>0)return Math.floor(Math.random()*T.length);const q=queue&&queue.includes(cur)?queue:T.map((_,i)=>i),p=q.indexOf(cur);return q[(p+d+q.length)%q.length]}
$('#pl').onclick=()=>{if(cur<0){if(T.length)playList(T)}else au.paused?au.play():au.pause()};
$('#nx').onclick=()=>play(nextIdx(1));$('#pv').onclick=()=>{if(au.currentTime>3)au.currentTime=0;else play(nextIdx(-1))};
$('#sh').onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle('on',shuf)};$('#rp').onclick=e=>{rep=!rep;e.currentTarget.classList.toggle('on',rep)};
au.onplay=au.onpause=()=>{$('#pi').innerHTML=au.paused?ic.play:ic.pause;if(!au.paused){setupAudio();AC&&AC.state==='suspended'&&AC.resume()}};
au.onended=()=>{if(rep){au.currentTime=0;au.play()}else play(nextIdx(1))};
const pct=(el,v)=>el.style.setProperty('--p',v+'%');
au.ontimeupdate=()=>{const d=au.duration||0;$('#tc').textContent=fmt(au.currentTime);$('#td').textContent=fmt(d);if(d){$('#sk').value=au.currentTime/d*1000;pct($('#sk'),au.currentTime/d*100)}lyTick()};
$('#sk').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};
$('#vo').oninput=e=>{au.volume=e.target.value/100;pct(e.target,e.target.value)};pct($('#vo'),80);
function updLike(){const t=T[cur];$('#lk').classList.toggle('on',!!t&&likes.has(t.key))}
$('#lk').onclick=()=>{const t=T[cur];if(!t)return;if(!likes.has(t.key)&&likes.size>=1000)return toast('Liked tracks limit reached (1,000)');likes.has(t.key)?likes.delete(t.key):likes.add(t.key);try{localStorage.setItem('drift-likes',JSON.stringify([...likes]))}catch(e){}syncUp();updLike();if(view==='lib')render()};
/* lyrics */
let li=-1;
function fsUpdate(){const t=T[cur];if(!t)return;$('#fa').src=t.cv;$('#ft').textContent=t.title;$('#fr').textContent=t.artist;$('#fbg').style.background=`radial-gradient(circle at 25% 30%,hsl(${t.seed%360} 70% 45%),transparent 55%),radial-gradient(circle at 80% 70%,hsl(${(t.seed+60)%360} 70% 35%),transparent 55%),#050505`;
