  const keys=j.tracks.map(x=>addStream({title:x.title,artist:x.artist,dur:x.dur,cover:x.cover,alt:x.id?{p:'sp',uri:'spotify:track:'+x.id}:null}).key);if(j.tracks.length>1){P.push({id:'p'+Date.now(),name:j.name,keys});savePl()}toast(`Added ${j.tracks.length} track${j.tracks.length===1?'':'s'}`)}
 else{const j=await jf('/api/meta?url='+encodeURIComponent(u));addStream({title:j.title,artist:j.artist,cover:j.cover,stream:j.stream});toast('Track added')}render()}catch(e){toast(er(e))}};
/* poster scan */
let PS=null;
const shrink=(f,m)=>new Promise((res,rej)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k|0;c.height=i.height*k|0;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};i.onerror=rej;i.src=u});
const posterBox=()=>`<div style="margin-bottom:14px"><input type="file" id="pfile" accept="image/*" hidden onchange="posterScan(this)"><button class="btn g" onclick="$('#pfile').click()">Scan poster</button>${PS?`<div class="card" style="margin-top:10px"><b>${esc(PS.event||PS.venue||'Poster')}</b><span class="sub">${esc([PS.venue,PS.city,PS.date].filter(Boolean).join(' · '))}</span><div style="margin:8px 0">${PS.acts.map((a,i)=>`<button class="btn g" style="margin:3px" onclick="posterLog(${i})">${esc(a)} ＋</button>`).join('')}</div><button class="btn" onclick="posterLog(-1)">Log all ${PS.acts.length}</button> <button class="x" onclick="PS=null;render()">✕</button></div>`:''}</div>`;
async function posterScan(inp){const f=inp.files[0];inp.value='';if(!f)return;if(!(API&&ME))return toast('Log in on a Drift server first');toast('Reading poster…');try{PS=await jf('/api/poster',{method:'POST',body:JSON.stringify({image:await shrink(f,1400)})});if(!PS.acts.length){PS=null;return toast('No acts found on that poster')}render()}catch(e){PS=null;toast(er(e))}}
async function posterLog(i){const a=i<0?PS.acts:[PS.acts[i]],v=[PS.venue,PS.city].filter(Boolean).join(', ');try{for(const x of a)await jf('/api/e',{method:'POST',body:JSON.stringify({kind:'gig',artist:x,day:PS.date,data:{venue:v,rating:0,type:PS.acts.length>3?'festival':'gig',notes:PS.event||''}})});toast('Logged '+a.length);DL.gig=0;if(i<0)PS=null;render()}catch(e){toast(er(e))}}
/* profiles: avatar, banner, bio */
let MP=null,PV=null,curProf='';
const img2url=(f,w,h,q)=>new Promise((res,rej)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),k=Math.max(w/i.width,h/i.height),dw=i.width*k,dh=i.height*k;x.drawImage(i,(w-dw)/2,(h-dh)/2,dw,dh);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};i.onerror=rej;i.src=u});
const _acct=acctView;
acctView=function(m){if(!(API&&ME))return _acct(m);if(!MP){jf('/api/profile/'+ME.name).then(j=>{MP=j;if(view==='acct')render()}).catch(()=>{});m.innerHTML='<h2 style="margin-top:0">Account</h2>';return}
 m.innerHTML=`<h2 style="margin-top:0">Hi, <b>${esc(ME.name)}</b></h2><div class="pf"><div class="pbn" style="background-image:url(${MP.banner||''})"></div><div class="pav" style="background-image:url(${MP.avatar||''})"></div></div><div class="pn" style="flex-wrap:wrap;margin:12px 0"><button class="btn g" onclick="$('#bf').click()">Change banner</button><button class="btn g" onclick="$('#af').click()">Change avatar</button><input type="file" id="bf" accept="image/*" hidden onchange="pimg(this,'banner')"><input type="file" id="af" accept="image/*" hidden onchange="pimg(this,'avatar')"></div><textarea class="s" id="pbio" maxlength="280" placeholder="Short bio" style="max-width:620px;width:100%">${esc(MP.bio||'')}</textarea><div class="pn" style="margin-top:10px"><button class="btn" onclick="psave()">Save profile</button><button class="btn g" onclick="goProf('${ME.name}')">View profile</button><button class="btn g" onclick="auth('logout')">Log out</button></div>`};
async function psave(extra){try{await jf('/api/profile',{method:'PUT',body:JSON.stringify({bio:($('#pbio')||{}).value||'',...extra})});if(extra)Object.assign(MP,extra);else MP.bio=$('#pbio').value;toast('Profile saved');render()}catch(e){toast(er(e))}}
async function pimg(inp,k){const f=inp.files[0];inp.value='';if(!f)return;try{psave({[k]:await img2url(f,k==='avatar'?256:1000,k==='avatar'?256:250,.8)})}catch(e){toast('Could not read that image')}}
function goProf(n){curProf=n;PV=null;view='prof';render()}
const folP=async n=>{try{await jf('/api/follow',{method:'POST',body:JSON.stringify({name:n})});PV=null;DL.feed=0;render()}catch(e){toast(er(e))}},unfolP=async n=>{try{await jf('/api/unfollow',{method:'POST',body:JSON.stringify({name:n})});PV=null;DL.feed=0;render()}catch(e){toast(er(e))}};
function profView(m){const q=PV&&PV.name===curProf?PV:null;if(!q){m.innerHTML='<p class="empty">Loading…</p>';jf('/api/profile/'+encodeURIComponent(curProf)).then(j=>{PV=j;if(view==='prof')render()}).catch(e=>{toast(er(e));view='home';render()});return}
 m.innerHTML=`<div class="pf"><div class="pbn" style="background-image:url(${q.banner||''})"></div><div class="pav" style="background-image:url(${q.avatar||''})"></div></div><h1 style="font-size:clamp(28px,5vw,48px)">${esc(q.name)}</h1><p class="empty" style="padding:4px 0">${esc(q.bio)}</p><p class="sub" style="margin:6px 0 14px">${q.gigs} gigs · ${q.albums} albums rated · ${q.followers} followers</p>${q.self?'':`<button class="btn${q.following?' g':''}" onclick="${q.following?'unfolP':'folP'}('${esc(q.name)}')">${q.following?'Following':'Follow'}</button>`}${q.recent?`<h2>Recent</h2>`+q.recent.map(e=>{const d=JSON.parse(e.data),g=e.kind==='gig';return `<div class="card"><b>${esc(g?e.artist:d.title)}</b><span class="sub">${esc(g?(d.venue||'')+' '+(e.day||''):e.artist+(d.rating?' · '+d.rating+'/10':''))}</span></div>`}).join(''):'<p class="empty">Follow this person to see their diary.</p>'}`}
/* views */
const rowH=(t,i,ex='')=>`<button class="tr${i===cur?' cur':''}" data-i="${i}"><img src="${t.cv}" alt=""><span class="m"><span class="t">${esc(t.title)}</span><span class="sub">${esc(t.artist)}</span></span>${ex}<span class="d">${t.dur?fmt(t.dur):''}</span><span class="x kb" data-m="${i}" title="More">⋮</span></button>`;
function mixes(){const n=Math.min(6,Math.max(1,T.length)),o=[];for(let k=0;k<n;k++){const l=T.map((_,i)=>T[(i+k)%T.length]);o.push({n:k+1,l,seed:hash('mix'+k)})}return o}
function render(){const m=$('#main');hist();document.querySelectorAll('#side [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view||(view==='pl'&&b.dataset.v==='lib')));
 if(view==='home'){m.innerHTML=`<div class="hero"><canvas id="halo" width="420" height="210"></canvas><h1>My<br><span>Drift</span></h1><div><button class="btn" id="hp">▶ &nbsp;<span>Play</span></button> <button class="btn g" id="ha" title="Add music">＋ <span>Add music</span></button></div></div>
 ${recentRow()}<h2>Your <b>Mixes</b></h2><div class="row">${mixes().map(x=>`<button class="mix" data-m="${x.n-1}"><div class="c"><img src="${cover(x.seed,176)}" alt=""><i>MIX ${x.n}</i></div><p>Daily Mix ${x.n}</p><small>${esc(x.l.slice(0,3).map(t=>t.artist).join(', '))}</small></button>`).join('')}</div>
 <h2>Listening <b>right now</b></h2><div class="list">${T.map((t,i)=>rowH(t,i)).join('')}</div>`;
  $('#hp').onclick=()=>playList(T);$('#ha').onclick=()=>$('#fa_in').click();m.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>playList(mixes()[b.dataset.m].l))}
 else if(view==='search'){m.innerHTML=`<h2 style="margin-top:0">Search</h2><input class="s" id="q" placeholder="Songs or artists" value="${esc(window._q||'')}" autofocus><div class="list" id="res" style="margin-top:18px"></div>`;const run=()=>{window._q=$('#q').value;const q=_q.toLowerCase(),r=T.map((t,i)=>[t,i]).filter(([t])=>!q||(t.title+t.artist).toLowerCase().includes(q));$('#res').innerHTML=r.map(([t,i])=>rowH(t,i)).join('')||'<p class="empty">No matches.</p>';bind()};$('#q').oninput=run;run();return}
 else if(view==='pl'){plView(m)}else if(view==='acct'){acctView(m)}else if(view==='room'){roomView(m)}else if(view==='diary'){diaryView(m)}else if(view==='set'){setView(m)}else if(view==='art'){artView(m)}else if(view==='prof'){profView(m)}else{const l=T.map((t,i)=>[t,i]);m.innerHTML=`<h2 style="margin-top:0">Library</h2>${plSec()}${impBox()}<h2 style="font-size:20px;margin:0 0 10px">Liked <b>${[...likes].filter(k=>T.some(t=>t.key===k)).length}</b></h2><div class="list">${l.filter(([t])=>likes.has(t.key)).map(([t,i])=>rowH(t,i)).join('')||'<p class="empty">Tap the heart on a track to save it here.</p>'}</div>${artistRow()}<h2>All tracks</h2><div class="list">${l.map(([t,i])=>rowH(t,i,(t.rec||t.sx)?`<span class="x" data-rm="${i}" title="Remove from library">✕</span>`:'')).join('')}</div>`}
 bind()}
function bind(){if(view!=='pl'&&view!=='art')document.querySelectorAll('#main .tr').forEach(b=>b.onclick=()=>{queue=null;play(+b.dataset.i)});
document.querySelectorAll('#main [data-rm]').forEach(x=>x.onclick=e=>{e.stopPropagation();rmTrack(+x.dataset.rm)});
document.querySelectorAll('#main [data-pr]').forEach(x=>x.onclick=e=>{e.stopPropagation();P.find(p=>p.id===curPl).keys.splice(+x.dataset.pr,1);savePl();render()});
document.querySelectorAll('#main [data-p]').forEach(b=>b.onclick=()=>{curPl=b.dataset.p;view='pl';render()});
const pc=$('#pc');if(pc)pc.onclick=()=>{const n=$('#pn').value.trim();if(!n)return;if(P.length>=50)return toast('Playlist limit reached (50)');P.push({id:'p'+Date.now(),name:n,keys:[]});savePl();render()}}
document.querySelectorAll('#side [data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;if(e.code==='Space'){e.preventDefault();$('#pl').click()}if(e.key==='Escape')$('#fs').classList.remove('open')});
/* hero halftone animation */
(function loop(t){const c=$('#halo');if(c){const x=c.getContext('2d'),W=c.width,H=c.height,s=11,k=au.paused?.4:1;x.clearRect(0,0,W,H);for(let i=0;i<W/s;i++)for(let j=0;j<H/s;j++){const u=(i*s-W/2)/(W/2),v=(j*s-H/2)/(H/2),d=Math.hypot(u,v*1.2),a=Math.max(0,1-d)*(.6+.4*Math.sin(t/500*k+d*6+Math.atan2(v,u)*2)),r=a*s*.52;if(r>.4){x.fillStyle='#d4f5b4';x.beginPath();x.arc(i*s+s/2,j*s+s/2,r,0,7);x.fill()}}}requestAnimationFrame(loop)})(0);
$('#bc').src=T[0].cv;render();
</script></body></html>
